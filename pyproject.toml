[tool.poetry]
name = "sentinel"
version = "1.0.0"
description = "SENTINEL — Sovereign AI-native financial terminal. Replaces Bloomberg at $0/yr."
authors = ["SENTINEL Team"]
readme = "README.md"
packages = [{ include = "sentinel" }]

[tool.poetry.dependencies]
python = "^3.11"

# ─── Data Sources ──────────────────────────────────────────────────────────────
yfinance = ">=0.2.40"
fredapi = ">=0.5.1"
finnhub-python = ">=2.4.20"
ccxt = ">=4.3.0"
polygon-api-client = ">=1.14.0"
alpaca-py = ">=0.26.0"
edgartools = ">=2.0.0"
httpx = ">=0.27.0"
feedparser = ">=6.0.11"

# ─── Social & Web ──────────────────────────────────────────────────────────────
praw = ">=7.7.0"                    # Reddit API (read-only, no auth needed for public)
pandas-datareader = ">=0.10.0"      # Ken French FF5 factor data
pytrends = ">=4.9.0"               # Google Trends via pytrends
xlsxwriter = ">=3.0.0"             # Bloomberg-style Excel export

# ─── Optional (heavy build) ────────────────────────────────────────────────────
# nautilus-trader = ">=1.190.0"     # Uncomment to enable event-driven backtest

# ─── Financial Analytics ───────────────────────────────────────────────────────
vectorbt = ">=0.26.2"
# QuantLib-Python — install separately if build fails: pip install QuantLib
# QuantLib = ">=1.33"
PyPortfolioOpt = ">=1.5.5"
Riskfolio-Lib = ">=6.3.0"
pandas-ta = ">=0.3.14b"
hmmlearn = ">=0.3.2"
scipy = ">=1.13.0"

# ─── AI / NLP ──────────────────────────────────────────────────────────────────
anthropic = ">=0.34.0"
fastmcp = ">=0.9.0"
transformers = ">=4.44.0"
sentence-transformers = ">=3.1.0"
torch = ">=2.3.0"
llama-index = ">=0.11.0"
llama-index-vector-stores-postgres = ">=0.2.0"

# ─── Database ──────────────────────────────────────────────────────────────────
asyncpg = ">=0.29.0"
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.31"}
psycopg2-binary = ">=2.9.9"
pgvector = ">=0.3.2"
redis = ">=5.0.8"
duckdb = ">=1.0.0"

# ─── API / Server ──────────────────────────────────────────────────────────────
fastapi = ">=0.113.0"
uvicorn = {extras = ["standard"], version = ">=0.30.6"}
pydantic = ">=2.9.0"
pydantic-settings = ">=2.4.0"
streamlit = ">=1.38.0"
websockets = ">=13.1"

# ─── Utilities ──────────────────────────────────────────────────────────────────
structlog = ">=24.4.0"
tenacity = ">=9.0.0"
pandas = ">=2.2.2"
numpy = ">=1.26.4"
python-dotenv = ">=1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.2"
pytest-asyncio = ">=0.23.8"
pytest-cov = ">=5.0.0"
ruff = ">=0.6.0"
mypy = ">=1.11.0"
black = ">=24.8.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # Line too long — handled by black

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
sentinel-terminal = "sentinel.stu.terminal:main"
sentinel-api = "sentinel.api.main:app"
sentinel-mcp = "sentinel.sil.mcp_server:run_server"
sentinel-bootstrap = "scripts.bootstrap:main"

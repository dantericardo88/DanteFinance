[tool.poetry]
name = "sentinel"
version = "0.1.0"
description = "Sovereign AI-native financial terminal — replaces Bloomberg at $0/yr"
authors = ["Ricky Porras <richard.porras@realempanada.com>"]
license = "MIT"
readme = "README.md"
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"

# Data ingestion
yfinance = "^0.2"
pandas-datareader = "^0.10"
fredapi = "^0.5"
finnhub-python = "^2.4"
alpha-vantage = "^2.3"
fmpsdk = "^0.2"
ccxt = "^4"
polygon-api-client = "^1.14"
alpaca-py = "^0.26"
edgartools = "^2"
sec-edgar-downloader = "^5"
httpx = "^0.27"
aiohttp = "^3.9"
feedparser = "^6"
websockets = "^12"

# Instrument mastering
requests = "^2.31"

# Fixed income
QuantLib = "^1.33"

# Quant finance
pandas = "^2.2"
numpy = "^1.26"
scipy = "^1.13"
statsmodels = "^0.14"
hmmlearn = "^0.3"
pandas-ta = "^0.3"
empyrical-reloaded = "^0.5"
PyPortfolioOpt = "^1.5"
Riskfolio-Lib = "^6"
arch = "^6"
py-vollib = "^1"
numba = "^0.59"
optuna = "^3.6"
quantstats = "^0.0.62"

# Backtesting
vectorbt = "^0.26"
# nautilus-trader installed separately (Rust build)

# AI / NLP
anthropic = "^0.30"
llama-index = "^0.10"
llama-index-vector-stores-postgres = "^0.1"
sentence-transformers = "^3"
transformers = "^4.40"
torch = "^2.3"
spacy = "^3.7"
openai-whisper = "^20231117"
yt-dlp = "^2024"
rank-bm25 = "^0.2"
fastmcp = "^0.4"
pytrends = "^4.9"
praw = "^7.7"
textblob = "^0.17"

# Storage
asyncpg = "^0.29"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
alembic = "^1.13"
redis = {extras = ["asyncio"], version = "^5.0"}
pgvector = "^0.3"

# API
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.30"}
websockets = "^12"
pydantic = "^2.7"
pydantic-settings = "^2.3"

# Terminal UI
streamlit = "^1.35"
plotly = "^5.22"
altair = "^5.3"
rich = "^13"

# Scheduling
APScheduler = "^3.10"
pandas-market-calendars = "^4.4"

# Utilities
python-dotenv = "^1.0"
structlog = "^24"
tenacity = "^8.3"
pyarrow = "^16"
polars = "^0.20"
duckdb = "^0.10"
beautifulsoup4 = "^4.12"
lxml = "^5"
camelot-py = {extras = ["cv"], version = "^0.11"}
pdfplumber = "^0.11"
xlsxwriter = ">=3.0.0"
pycoingecko = "^3.1"
web3 = "^6"

[tool.poetry.group.dev.dependencies]
pytest = "^8"
pytest-asyncio = "^0.23"
pytest-cov = "^5"
ruff = "^0.4"
black = "^24"
mypy = "^1.10"
ipython = "^8"
jupyterlab = "^4"

[tool.poetry.scripts]
sentinel = "sentinel.api.main:run"
sentinel-terminal = "sentinel.stu.app:main"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
